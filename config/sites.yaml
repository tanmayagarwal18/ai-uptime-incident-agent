# Monitored targets.
# failure_threshold = consecutive failed checks before an incident is opened.
# critical = true raises the severity the agent assigns to outages.

sites:
  # --- Local demo server (python -m uvicorn demo.flaky_server:app --port 8001) ---
  - name: demo-orders-api
    url: http://127.0.0.1:8001/api/orders
    description: Demo shop orders API (failure modes switchable from the dashboard)
    expected_status: 200
    timeout_s: 5
    latency_threshold_ms: 1500
    failure_threshold: 2
    critical: true

  - name: demo-homepage
    url: http://127.0.0.1:8001/
    description: Demo shop homepage
    expected_status: 200
    timeout_s: 5
    latency_threshold_ms: 1500
    failure_threshold: 2

  # --- Real public endpoints ---
  - name: google
    url: https://www.google.com
    expected_status: 200
    timeout_s: 8
    latency_threshold_ms: 2500
    failure_threshold: 3

  - name: github-api
    url: https://api.github.com
    expected_status: 200
    timeout_s: 8
    latency_threshold_ms: 2500
    failure_threshold: 3
    critical: true

  - name: httpbin
    url: https://httpbin.org/status/200
    expected_status: 200
    timeout_s: 10
    latency_threshold_ms: 4000
    failure_threshold: 3

  # Uncomment to watch a permanently broken target (DNS failure):
  # - name: broken-dns-example
  #   url: https://this-domain-does-not-exist-12345.com
  #   failure_threshold: 2
